      - generic [ref=f1e57]: 01 / Engineering & ML
      - heading [level=2] [ref=f1e58]:
        - text: "The real work:"
        - emphasis [ref=f1e59]: machine learning for physical systems.
      - paragraph [ref=f1e60]: My highest-leverage project, and the direction I am betting on. Applying machine learning to hard, physical engineering problems rather than to abstractions.
    - article [ref=f1e61]:
      - generic [ref=f1e62]:
        - generic [ref=f1e63]: SOC battery research · University of Bath
        - generic [ref=f1e64]: Private repo · paper in view
      - heading [level=3] [ref=f1e65]:
        - text: Teaching a neural network to read a battery's charge
        - emphasis [ref=f1e66]: from sound.
      - generic [ref=f1e67]:
        - generic [ref=f1e68]:
          - heading "The problem" [level=4] [ref=f1e69]
          - paragraph [ref=f1e70]: Lithium-ion state of charge is deceptively hard to measure. Coulomb counting drifts, the voltage curve sits flat for most of a discharge, and the ultrasound signal that does carry charge is tangled up in hysteresis, temperature and current. There is no clean mapping to invert.
        - generic [ref=f1e71]:
          - heading "The approach" [level=4] [ref=f1e72]
          - paragraph [ref=f1e73]: "I built the estimator from first principles: a NumPy MLP with the backpropagation and Adam optimiser derived and written by hand before touching a framework, then PyTorch RNN and LSTM models that fuse the acoustic features, time of flight, wave velocity and displacement, with voltage, current, temperature and coulomb counting. Memory is the point: an LSTM resolves the charge-discharge hysteresis a memoryless model physically cannot."
        - generic [ref=f1e74]:
          - heading "Where it is" [level=4] [ref=f1e75]
          - paragraph [ref=f1e76]: A University of Bath research internship under Dr Christopher Vagg and Rob Gray, built on what my supervisor calls the best ultrasound-SOC dataset available anywhere, real drive cycles rather than toy laboratory sweeps. The work is being written up for a journal publication, with the hard part, generalising cleanly to real-world mission profiles, the problem I am on now.
      - generic [ref=f1e77]:
